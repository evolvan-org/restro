name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the in-flight run (save runner minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  # One job runs every static check after a single install + prisma generate.
  # Steps use `if: !cancelled()` so a failure in one still reports the rest.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      # `prisma migrate diff --from-migrations` replays migrations into a shadow DB.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for the gitleaks scan.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: yarn format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: yarn typecheck

      - name: Prisma migration drift
        if: ${{ !cancelled() }}
        # Exit code 2 => schema.prisma has changes not captured by a migration.
        run: |
          yarn workspace @rms/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow?schema=public \
            --exit-code

      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  # Slow tier: full container boot, gated behind the static checks.
  # Boots the PRODUCTION stack (docker-compose.prod.yml: same ports, image tags,
  # required secrets and build args as prod) so a failure here is a failure prod
  # would have hit.
  # Keep `name` stable: branch protection matches required checks by this name.
  docker-smoke:
    name: Docker smoke (build + boot stack)
    runs-on: ubuntu-latest
    needs: verify
    env:
      # Every `docker compose` command in this job targets the production stack,
      # exactly as `COMPOSE_FILE` in the server's .env does.
      COMPOSE_FILE: docker-compose.prod.yml
      # Must match the web image's build arg below: the browser-facing API URL.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Required by the production stack; throwaway CI-only credential.
      POSTGRES_PASSWORD: ci-smoke-postgres-password
      # Boot-only throwaway; env validation requires it but it grants nothing.
      JWT_SECRET: ci-smoke-test-secret-not-used-for-anything
      PUSHER_APP_ID: ci-placeholder
      PUSHER_KEY: ci-placeholder
      PUSHER_SECRET: ci-placeholder
      PUSHER_CLUSTER: ap2
      # Email and rate-limit config is validated at boot too; no email is sent in the smoke test.
      RATE_LIMIT_HASH_SECRET: ci-smoke-rate-limit-secret-unused
      EMAIL_PROVIDER_API_KEY: ci-placeholder
      EMAIL_TEMPLATE_VERIFY_EMAIL_ID: '1'
      EMAIL_TEMPLATE_RESET_PASSWORD_ID: '2'
      EMAIL_TEMPLATE_STAFF_INVITE_ID: '3'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The local stack is no longer booted here; at least keep it parseable.
      - name: Validate both compose files
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.prod.yml config -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build both targets with GitHub Actions layer cache and load them into
      # the local Docker so `up --no-build` reuses them (no rebuild).
      - name: Build api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          tags: rms-api:prod
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          tags: rms-web:prod
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # A runtime image must not need the internet to start (e.g. corepack
      # downloading Yarn on boot). Run web with no network at all.
      - name: Web starts with no network access
        run: |
          docker run -d --network none --name web-offline rms-web:prod
          for i in $(seq 1 30); do
            if docker exec web-offline node -e "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              echo "web served 200 offline"; docker rm -f web-offline; exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' web-offline)" != "true" ]; then break; fi
            sleep 2
          done
          echo "web failed to start without network:"; docker logs web-offline; exit 1

      - name: Boot the stack and wait for healthy
        run: docker compose up -d --no-build --wait

      # Container healthchecks probe from inside; also hit the host-published
      # production ports the way real clients do.
      - name: Probe production ports from the host
        run: |
          curl -fsS --retry 5 --retry-all-errors http://localhost:8000/status
          curl -fsS --retry 5 --retry-all-errors -o /dev/null http://localhost:3001/

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
