name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the in-flight run (save runner minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  # One job runs every static check after a single install + prisma generate.
  # Steps use `if: !cancelled()` so a failure in one still reports the rest.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      # `prisma migrate diff --from-migrations` replays migrations into a shadow DB.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history for the gitleaks scan.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Lint
        if: ${{ !cancelled() }}
        run: yarn lint

      - name: Format check
        if: ${{ !cancelled() }}
        run: yarn format:check

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: yarn typecheck

      - name: Prisma migration drift
        if: ${{ !cancelled() }}
        # Exit code 2 => schema.prisma has changes not captured by a migration.
        run: |
          yarn workspace @rms/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow?schema=public \
            --exit-code

      - name: Secret scan (gitleaks)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  # Slow tier: full container boot, gated behind the static checks.
  docker-smoke:
    name: Docker smoke (build + boot stack)
    runs-on: ubuntu-latest
    needs: verify
    env:
      # Boot-only throwaway; env validation requires it but it grants nothing.
      JWT_SECRET: ci-smoke-test-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build both targets with GitHub Actions layer cache and load them into
      # the local Docker so `up --no-build` reuses them (no rebuild).
      - name: Build api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          tags: rms-api:local
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          tags: rms-web:local
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Boot the stack and wait for healthy
        run: docker compose up -d --no-build --wait

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
