name: CI

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the in-flight run (save runner minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

jobs:
  # --- Fast tier: cheap checks that catch most failures in seconds ----------
  install:
    name: Install (lockfile guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: yarn lint

  format:
    name: Format (prettier --check)
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: yarn format:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: yarn typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: install
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rms?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: yarn test

  prisma-check:
    name: Prisma migration drift
    runs-on: ubuntu-latest
    needs: install
    services:
      # `migrate diff --from-migrations` replays migrations into a shadow DB.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shadow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      # Exit code 2 => schema.prisma has changes not captured by a migration
      # (i.e. someone edited the schema but forgot to create a migration).
      - name: Assert schema matches committed migrations
        run: |
          yarn workspace @rms/db exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://postgres:postgres@localhost:5432/shadow?schema=public \
            --exit-code

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --redact --verbose

  conventions:
    name: Branch name & commit messages
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: ./scripts/check-branch-name.sh "$BRANCH_NAME"
      - name: Lint PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

  # --- Slow tier: full container boot, gated behind the fast checks ----------
  docker-smoke:
    name: Docker smoke (build + boot stack)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      # Boot-only throwaway; env validation requires it but it grants nothing.
      JWT_SECRET: ci-smoke-test-secret-not-used-for-anything
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build both targets with GitHub Actions layer cache and load them into
      # the local Docker so `up --no-build` reuses them (no rebuild).
      - name: Build api image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          tags: rms-api:local
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          tags: rms-web:local
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Boot the stack and wait for healthy
        run: docker compose up -d --no-build --wait

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
