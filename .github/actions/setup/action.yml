name: Setup workspace
description: Enable Corepack (Yarn 4), set up Node 20 with a Yarn cache, and install deps immutably.

runs:
  using: composite
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Set up Node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 20
        cache: yarn

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
