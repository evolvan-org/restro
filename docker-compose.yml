# -----------------------------------------------------------------------------
# RMS local stack: postgres + api + web.
#
#   docker compose up --build          # build & start everything
#   docker compose down                # stop (keeps the db volume)
#   docker compose down -v             # stop & wipe the database
#
# Migrations:
#   * The api container runs `prisma migrate deploy` on startup, so committed
#     migrations are applied to the postgres container automatically.
#   * To CREATE a migration during development, run it from the host against the
#     exposed port (5432 -> postgres container):
#         yarn workspace @rms/db migrate:dev --name <change>
#     (root .env already points DATABASE_URL at localhost:5432)
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rms
    ports:
      # Host 5433 -> container 5432 (5432 is often taken by another local pg).
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rms']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: rms-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # `postgres` = the service name on the compose network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rms?schema=public
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-sabarjits@evolvan.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Restaurant Management System}
      EMAIL_TEMPLATE_VERIFY_EMAIL_ID: ${EMAIL_TEMPLATE_VERIFY_EMAIL_ID}
      EMAIL_TEMPLATE_RESET_PASSWORD_ID: ${EMAIL_TEMPLATE_RESET_PASSWORD_ID}
      EMAIL_TEMPLATE_STAFF_INVITE_ID: ${EMAIL_TEMPLATE_STAFF_INVITE_ID}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3001}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      # AI scans (REST-89). Photos live on the ai-uploads volume until the scan is used.
      AI_PROVIDER: ${AI_PROVIDER:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL_MENU: ${AI_MODEL_MENU:-gemini-2.5-flash-lite}
      AI_MODEL_INVOICE: ${AI_MODEL_INVOICE:-gemini-2.5-flash}
      AI_MODEL_RECIPES: ${AI_MODEL_RECIPES:-gemini-2.5-flash-lite}
      AI_UPLOAD_DIR: /app/data/ai-uploads
      AI_DAILY_MENU_SCANS: ${AI_DAILY_MENU_SCANS:-10}
      AI_DAILY_INVOICE_SCANS: ${AI_DAILY_INVOICE_SCANS:-20}
      WEB_ORIGIN: http://localhost:3001
    volumes:
      - ai-uploads:/app/data/ai-uploads
    ports:
      - '3000:3000'
    healthcheck:
      # slim image has no curl/wget; Node 20 has a global fetch().
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/status'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace for `prisma migrate deploy` + Nest boot before probes count.
      start_period: 40s

  web:
    image: rms-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        # Baked into the client bundle; browser reaches the API on the host.
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      # Wait until the API is actually serving, not just started.
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WEB_PORT: 3001
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3001/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  ai-uploads:
