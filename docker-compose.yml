# -----------------------------------------------------------------------------
# RMS local stack: postgres + api + web.
#
#   docker compose up --build          # build & start everything
#   docker compose down                # stop (keeps the db volume)
#   docker compose down -v             # stop & wipe the database
#
# Migrations:
#   * The api container runs `prisma migrate deploy` on startup, so committed
#     migrations are applied to the postgres container automatically.
#   * To CREATE a migration during development, run it from the host against the
#     exposed port (5432 -> postgres container):
#         yarn workspace @rms/db migrate:dev --name <change>
#     (root .env already points DATABASE_URL at localhost:5432)
# -----------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rms
    ports:
      # Host 5433 -> container 5432 (5432 is often taken by another local pg).
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d rms']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: rms-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      # `postgres` = the service name on the compose network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/rms?schema=public
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: http://localhost:3001
    ports:
      - '3000:3000'
    healthcheck:
      # slim image has no curl/wget; Node 20 has a global fetch().
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3000/status'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      # Grace for `prisma migrate deploy` + Nest boot before probes count.
      start_period: 40s

  web:
    image: rms-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        # Baked into the client bundle; browser reaches the API on the host.
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: unless-stopped
    depends_on:
      # Wait until the API is actually serving, not just started.
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WEB_PORT: 3001
    ports:
      - '3001:3001'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:3001/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
